name: Phoenix Firmware Tools CI

on:
  push:
    paths:
      - "tools/phoenix-inspector/**"
      - "tools/phoenix-img4/**"
      - "tools/phoenix-fdt/**"
      - ".github/workflows/phoenix-inspector.yml"
  pull_request:
    paths:
      - "tools/phoenix-inspector/**"
      - "tools/phoenix-img4/**"
      - ".github/workflows/phoenix-inspector.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Phoenix Inspector
        working-directory: tools/phoenix-inspector
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix IMG4 Parser
        working-directory: tools/phoenix-img4
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix FDT Analyzer
        working-directory: tools/phoenix-fdt
        run: python -m unittest discover -s tests -v
      - name: Check tool help
        run: |
          python tools/phoenix-inspector/phoenix_inspector.py --help
          python tools/phoenix-img4/phoenix_img4.py --help
          python tools/phoenix-fdt/phoenix_fdt.py --help
