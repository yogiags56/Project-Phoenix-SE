name: Phoenix Firmware Tools CI

on:
  push:
    paths:
      - "tools/phoenix-inspector/**"
      - "tools/phoenix-img4/**"
      - "tools/phoenix-fdt/**"
      - "tools/phoenix-macho/**"
      - "tools/phoenix-kc/**"
      - "tools/phoenix-kext/**"
      - "tools/phoenix-compat/**"
      - "tools/phoenix-a9-profile/**"
      - "tools/phoenix-dt-diff/**"
      - "tools/phoenix-kernel-compat/**"
      - "tools/phoenix-symbol-diff/**"
      - "tools/phoenix-kernel-graph/**"
      - "tools/phoenix-dashboard/**"
      - "tools/phoenix-pmu-catalog/**"
      - "tools/phoenix-pmu-semantic/**"
      - "tools/phoenix-patch-patterns/**"
      - "tools/phoenix-arm64-disasm/**"
      - "tools/phoenix-pmu-catalog/**"
      - "docs/research/**"
      - "README.md"
      - ".github/workflows/phoenix-inspector.yml"
  pull_request:
    paths:
      - "tools/phoenix-inspector/**"
      - "tools/phoenix-img4/**"
      - "tools/phoenix-fdt/**"
      - "tools/phoenix-macho/**"
      - "tools/phoenix-kc/**"
      - "tools/phoenix-kext/**"
      - "tools/phoenix-compat/**"
      - "tools/phoenix-a9-profile/**"
      - "tools/phoenix-dt-diff/**"
      - "tools/phoenix-kernel-compat/**"
      - "tools/phoenix-symbol-diff/**"
      - "tools/phoenix-kernel-graph/**"
      - "tools/phoenix-dashboard/**"
      - "docs/research/**"
      - "README.md"
      - ".github/workflows/phoenix-inspector.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Phoenix Inspector
        working-directory: tools/phoenix-inspector
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix IMG4 Parser
        working-directory: tools/phoenix-img4
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix FDT Analyzer
        working-directory: tools/phoenix-fdt
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Mach-O Analyzer
        working-directory: tools/phoenix-macho
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Kernel Collection Inspector
        working-directory: tools/phoenix-kc
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Kext Dependency Analyzer
        working-directory: tools/phoenix-kext
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Firmware Compatibility Mapper
        working-directory: tools/phoenix-compat
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix A9 Platform Profiler
        working-directory: tools/phoenix-a9-profile
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Device Tree Comparator
        working-directory: tools/phoenix-dt-diff
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Kernel Compatibility Analyzer
        working-directory: tools/phoenix-kernel-compat
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Symbol Diff
        working-directory: tools/phoenix-symbol-diff
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Kernel Dependency Graph
        working-directory: tools/phoenix-kernel-graph
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Evidence Dashboard
        working-directory: tools/phoenix-dashboard
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Patch Pattern Analyzer
        working-directory: tools/phoenix-patch-patterns
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix ARM64 Disassembly Analyzer
        working-directory: tools/phoenix-arm64-disasm
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU Signature Catalog
        working-directory: tools/phoenix-pmu-catalog
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU ARM64 Semantic Decoder
        working-directory: tools/phoenix-pmu-semantic
        run: python -m unittest discover -s tests -v
      - name: Check tool help
        run: |
          python tools/phoenix-inspector/phoenix_inspector.py --help
          python tools/phoenix-img4/phoenix_img4.py --help
          python tools/phoenix-fdt/phoenix_fdt.py --help
          python tools/phoenix-macho/phoenix_macho.py --help
          python tools/phoenix-kc/phoenix_kc.py --help
          python tools/phoenix-kext/phoenix_kext.py --help
          python tools/phoenix-compat/phoenix_compat.py --help
          python tools/phoenix-a9-profile/phoenix_a9_profile.py --help
          python tools/phoenix-dt-diff/phoenix_dt_diff.py --help
          python tools/phoenix-kernel-compat/phoenix_kernel_compat.py --help
          python tools/phoenix-symbol-diff/phoenix_symbol_diff.py --help
          python tools/phoenix-kernel-graph/phoenix_kernel_graph.py --help
          python tools/phoenix-dashboard/phoenix_dashboard.py --help
          python tools/phoenix-patch-patterns/phoenix_patch_patterns.py --help
          python tools/phoenix-arm64-disasm/phoenix_arm64_disasm.py --help
          python tools/phoenix-pmu-catalog/phoenix_pmu_catalog.py --help
          python tools/phoenix-pmu-semantic/phoenix_pmu_semantic.py --help
          python -m json.tool profiles/iphone-se-1st-gen.template.json > /dev/null
