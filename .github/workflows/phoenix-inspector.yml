name: Phoenix Inspector CI

on:
  push:
    paths:
      - "tools/phoenix-inspector/**"
      - ".github/workflows/phoenix-inspector.yml"
  pull_request:
    paths:
      - "tools/phoenix-inspector/**"
      - ".github/workflows/phoenix-inspector.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        working-directory: tools/phoenix-inspector
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python tools/phoenix-inspector/phoenix_inspector.py --help
