name: Phoenix Firmware Tools CI

on:
  push:
    paths:
      - "tools/phoenix-inspector/**"
      - "tools/phoenix-img4/**"
      - "tools/phoenix-evidence/**"
      - "tools/phoenix-payload/**"
      - "tools/phoenix-fdt/**"
      - "tools/phoenix-macho/**"
      - "tools/phoenix-kc/**"
      - "tools/phoenix-kext/**"
      - "tools/phoenix-compat/**"
      - "tools/phoenix-a9-profile/**"
      - "tools/phoenix-dt-diff/**"
      - "tools/phoenix-kernel-compat/**"
      - "tools/phoenix-symbol-diff/**"
      - "tools/phoenix-kernel-graph/**"
      - "tools/phoenix-dashboard/**"
      - "tools/phoenix-pmu-catalog/**"
      - "tools/phoenix-pmu-semantic/**"
      - "tools/phoenix-pmu-delta/**"
      - "tools/phoenix-pmu-ldo/**"
      - "tools/phoenix-pmu-dataflow/**"
      - "tools/phoenix-pmu-paths/**"
      - "tools/phoenix-pmu-discovery/**"
      - "tools/phoenix-pmu-vmmap/**"
      - "tools/phoenix-register-flow/**"
      - "tools/phoenix-patch-patterns/**"
      - "tools/phoenix-arm64-disasm/**"
      - "docs/research/**"
      - "research/**"
      - "README.md"
      - ".github/workflows/phoenix-inspector.yml"
  pull_request:
    paths:
      - "tools/phoenix-inspector/**"
      - "tools/phoenix-img4/**"
      - "tools/phoenix-fdt/**"
      - "tools/phoenix-macho/**"
      - "tools/phoenix-kc/**"
      - "tools/phoenix-kext/**"
      - "tools/phoenix-compat/**"
      - "tools/phoenix-a9-profile/**"
      - "tools/phoenix-dt-diff/**"
      - "tools/phoenix-kernel-compat/**"
      - "tools/phoenix-symbol-diff/**"
      - "tools/phoenix-kernel-graph/**"
      - "tools/phoenix-pmu-delta/**"
      - "tools/phoenix-pmu-ldo/**"
      - "tools/phoenix-pmu-dataflow/**"
      - "tools/phoenix-pmu-paths/**"
      - "tools/phoenix-pmu-vmmap/**"
      - "tools/phoenix-dashboard/**"
      - "docs/research/**"
      - "research/**"
      - "README.md"
      - ".github/workflows/phoenix-inspector.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Phoenix Inspector
        working-directory: tools/phoenix-inspector
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix IPSW Evidence Inspector
        working-directory: tools/phoenix-evidence
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Payload Inspector
        working-directory: tools/phoenix-payload
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix IMG4 Parser
        working-directory: tools/phoenix-img4
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix FDT Analyzer
        working-directory: tools/phoenix-fdt
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Mach-O Analyzer
        working-directory: tools/phoenix-macho
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Kernel Collection Inspector
        working-directory: tools/phoenix-kc
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Kext Dependency Analyzer
        working-directory: tools/phoenix-kext
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Firmware Compatibility Mapper
        working-directory: tools/phoenix-compat
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix A9 Platform Profiler
        working-directory: tools/phoenix-a9-profile
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Device Tree Comparator
        working-directory: tools/phoenix-dt-diff
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Kernel Compatibility Analyzer
        working-directory: tools/phoenix-kernel-compat
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Symbol Diff
        working-directory: tools/phoenix-symbol-diff
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Kernel Dependency Graph
        working-directory: tools/phoenix-kernel-graph
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Evidence Dashboard
        working-directory: tools/phoenix-dashboard
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Patch Pattern Analyzer
        working-directory: tools/phoenix-patch-patterns
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix ARM64 Disassembly Analyzer
        working-directory: tools/phoenix-arm64-disasm
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU Signature Catalog
        working-directory: tools/phoenix-pmu-catalog
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU Virtual Address Mapper
        working-directory: tools/phoenix-pmu-vmmap
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU Signature Discovery
        working-directory: tools/phoenix-pmu-discovery
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU LDO Symbolic Paths
        working-directory: tools/phoenix-pmu-paths
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU LDO Register Data-Flow
        working-directory: tools/phoenix-pmu-dataflow
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU LDO Overlap Reconstruction
        working-directory: tools/phoenix-pmu-ldo
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU Patch Delta Auditor
        working-directory: tools/phoenix-pmu-delta
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix PMU ARM64 Semantic Decoder
        working-directory: tools/phoenix-pmu-semantic
        run: python -m unittest discover -s tests -v
      - name: Test Phoenix Register Def-Use Analyzer
        working-directory: tools/phoenix-register-flow
        run: python -m unittest discover -s tests -v
      - name: Generate donorless PMU LDO symbolic paths
        run: python tools/phoenix-pmu-paths/phoenix_pmu_paths.py research/PMU-SIGNATURE-CATALOG.json --output /tmp/phoenix-pmu-ldo-paths.json
      - name: Generate donorless PMU LDO data-flow report
        run: python tools/phoenix-pmu-dataflow/phoenix_pmu_dataflow.py research/PMU-SIGNATURE-CATALOG.json --output /tmp/phoenix-pmu-ldo-dataflow.json
      - name: Generate donorless PMU LDO overlap report
        run: python tools/phoenix-pmu-ldo/phoenix_pmu_ldo.py research/PMU-SIGNATURE-CATALOG.json --output /tmp/phoenix-pmu-ldo-overlap.json
      - name: Generate donorless PMU delta audit
        run: python tools/phoenix-pmu-delta/phoenix_pmu_delta.py research/PMU-SIGNATURE-CATALOG.json --output /tmp/phoenix-pmu-delta-audit.json
      - name: Regenerate Phoenix PMU semantic report
        run: python tools/phoenix-pmu-semantic/phoenix_pmu_semantic.py research/PMU-SIGNATURE-CATALOG.json --output /tmp/phoenix-pmu-semantic-report.json
      - name: Check tool help
        run: |
          python tools/phoenix-inspector/phoenix_inspector.py --help
          python tools/phoenix-img4/phoenix_img4.py --help
          python tools/phoenix-evidence/phoenix_evidence.py --help
          python tools/phoenix-payload/phoenix_payload.py --help
          python tools/phoenix-fdt/phoenix_fdt.py --help
          python tools/phoenix-macho/phoenix_macho.py --help
          python tools/phoenix-kc/phoenix_kc.py --help
          python tools/phoenix-kext/phoenix_kext.py --help
          python tools/phoenix-compat/phoenix_compat.py --help
          python tools/phoenix-a9-profile/phoenix_a9_profile.py --help
          python tools/phoenix-dt-diff/phoenix_dt_diff.py --help
          python tools/phoenix-kernel-compat/phoenix_kernel_compat.py --help
          python tools/phoenix-symbol-diff/phoenix_symbol_diff.py --help
          python tools/phoenix-kernel-graph/phoenix_kernel_graph.py --help
          python tools/phoenix-dashboard/phoenix_dashboard.py --help
          python tools/phoenix-patch-patterns/phoenix_patch_patterns.py --help
          python tools/phoenix-arm64-disasm/phoenix_arm64_disasm.py --help
          python tools/phoenix-pmu-catalog/phoenix_pmu_catalog.py --help
          python tools/phoenix-pmu-semantic/phoenix_pmu_semantic.py --help
          python tools/phoenix-pmu-delta/phoenix_pmu_delta.py --help
          python tools/phoenix-pmu-ldo/phoenix_pmu_ldo.py --help
          python tools/phoenix-pmu-dataflow/phoenix_pmu_dataflow.py --help
          python tools/phoenix-pmu-paths/phoenix_pmu_paths.py --help
          python tools/phoenix-pmu-discovery/phoenix_pmu_discovery.py --help
          python tools/phoenix-pmu-vmmap/phoenix_pmu_vmmap.py --help
          python -m json.tool profiles/iphone-se-1st-gen.template.json > /dev/null
